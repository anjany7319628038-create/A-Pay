<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071b35">
<title>A Pay Wallet</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="brandmark">A</div><div><b>A Pay</b><small>WALLET • DEMO</small></div></div>
  <button class="profile-button" id="navProfile" aria-label="Open profile"><span id="avatarLetter">A</span></button>
</header>
<main class="page">
  <section class="welcome"><div><small class="eyebrow">WELCOME BACK</small><h1 id="helloName">Your wallet</h1></div><span class="status-dot">DEMO MODE</span></section>
  <section class="balance-card">
    <div class="balance-top"><span>Available demo balance</span><span class="balance-chip">₹ INR</span></div>
    <div class="balance-amount" id="balance">₹2,500.00</div>
    <div class="balance-caption">Sample balance • Not real money</div>
    <div class="balance-actions"><button id="add" class="light-button">＋ Add demo money</button><button id="historyJump" class="outline-button">History ↘</button></div>
  </section>
  <section class="section">
    <div class="section-title"><div><small class="eyebrow">YOUR SHORTCUTS</small><h2>Quick actions</h2></div></div>
    <div class="action-grid">
      <button class="action" id="send"><span class="action-symbol send-symbol">↗</span><b>Send</b><small>Demo transfer</small></button>
      <button class="action" id="receive"><span class="action-symbol receive-symbol">▦</span><b>Receive</b><small>My demo QR</small></button>
      <button class="action" id="scan"><span class="action-symbol scan-symbol">⌗</span><b>Scan QR</b><small>Read UPI details</small></button>
      <button class="action" id="mobile"><span class="action-symbol mobile-symbol">▯</span><b>Recharge</b><small>Demo preview</small></button>
    </div>
  </section>
  <section class="info-banner"><div class="banner-icon">✦</div><div><b>Simple money overview</b><p>Explore A Pay safely with demo transactions. No real payment is processed.</p></div></section>
  <section class="section history-section" id="history">
    <div class="section-title"><div><small class="eyebrow">ACTIVITY</small><h2>Recent transactions</h2></div><button class="text-button" id="clear">Clear</button></div>
    <div id="transactions" class="transaction-list"></div>
  </section>
</main>
<nav class="bottom-nav"><button class="active" id="navHome"><span>⌂</span><small>Home</small></button><button id="navHistory"><span>↻</span><small>Activity</small></button><button id="navProfileBottom"><span>◉</span><small>Profile</small></button></nav>
<div class="modal hidden" id="modal"><div class="sheet"><button class="close" id="close" aria-label="Close">×</button><div id="modalContent"></div></div></div>
<script src="app.js"></script>
</body>
</html>
